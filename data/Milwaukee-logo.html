.logo{animation:breathe 6s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(226,0,40,.28))}
.glow{filter:blur(12px) brightness(1.15);opacity:.22;mix-blend-mode:screen;animation:pulse 4s ease-in-out infinite}
.sweep{position:absolute;inset:-18%;background:linear-gradient(110deg, transparent 43%, rgba(255,255,255,0) 46%, rgba(255,255,255,.72) 50%, rgba(255,255,255,0) 54%, transparent 57%);mix-blend-mode:screen;filter:blur(2px)}
.one{animation:sweep 5.8s linear infinite} .two{animation:sweep 7.5s linear infinite 2.8s;opacity:.5}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.65);opacity:0}
.spark:before,.spark:after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff}
.spark:before{width:2px;height:34px} .spark:after{width:34px;height:2px}
.spark i,.spark b{position:absolute;left:50%;top:50%;width:24px;height:2px;background:rgba(255,230,230,.7);display:block}
.spark i{transform:translate(-50%,-50%) rotate(45deg)} .spark b{transform:translate(-50%,-50%) rotate(-45deg)}
.p1{left:18%;top:28%;animation:twinkle 4.6s ease-in-out infinite} .p2{left:47%;top:34%;animation:twinkle 5.2s ease-in-out infinite 1.1s} .p3{left:77%;top:18%;animation:twinkle 4.8s ease-in-out infinite 2.1s} .p4{left:65%;top:67%;animation:twinkle 5.4s ease-in-out infinite 3.0s}
@keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.35)}18%{opacity:0}35%{opacity:.82;transform:scale(1)}55%{opacity:.1;transform:scale(.55)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.003)}}
@keyframes pulse{0%,100%{opacity:.16}50%{opacity:.28}}
