name: Update GK data and deploy dashboard

on:
  push:
    branches:
      - main
    paths:
      # Upload/replace raw GK exports here.
      - "GK folder/**"

      # Supervisor mapping inputs.
      - "data/IDL List.xlsx"
      - "data/IDL List Sep2026.xlsx"

      # Pipeline / dashboard source code.
      - "Zone3_GK_folder_updater.py"
      - "build_dashboard.py"
      - "gk_dashboard_core.py"
      - "requirements.txt"
      - ".github/workflows/deploy-dashboard.yml"

  workflow_dispatch:

permissions:
  # write is required so the generated master can be saved back to main.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate master from raw GK files
        run: python Zone3_GK_folder_updater.py

      - name: Build static dashboard
        run: python build_dashboard.py

      # Save the generated Master back to the repository so the next run always
      # starts from the newest history. The workflow trigger intentionally does
      # not watch this generated file, so this commit does not create a loop.
      - name: Save generated master to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/Submitter_Tracking_Master_With_Supervisor.xlsx"
          if git diff --cached --quiet; then
            echo "Master has no changes."
          else
            git commit -m "Auto-update GK master [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp official.html site/official.html
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
